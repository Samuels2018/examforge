services:
  ollama:
    image: ollama/ollama:latest
    container_name: examforge-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  app:
    build:
      context: ./backend
    container_name: examforge-app
    ports:
      - "8000:8000"
    environment:
      EXAMFORGE_ENVIRONMENT: prod
      EXAMFORGE_DATABASE_URL: sqlite:////data/examforge.db
      EXAMFORGE_UPLOAD_DIR: /data/uploads
      EXAMFORGE_BACKUP_DIR: /data/backups
      EXAMFORGE_LLM_PROVIDER: auto
      EXAMFORGE_OLLAMA_BASE_URL: http://ollama:11434
      EXAMFORGE_OLLAMA_MODEL: ${EXAMFORGE_OLLAMA_MODEL:-qwen2.5:7b}
      EXAMFORGE_CORS_ORIGINS: '["http://localhost:5173"]'
      EXAMFORGE_AUTH_REQUIRED: ${EXAMFORGE_AUTH_REQUIRED:-false}
    volumes:
      - examforge_data:/data
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=3).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: examforge-frontend
    ports:
      - "5173:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  ollama_data:
  examforge_data:
