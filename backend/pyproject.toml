[project]
name = "examforge-backend"
version = "0.1.0"
description = "API local-first para convertir material de examen en ejercicios interactivos"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "python-pptx>=1.0",
  "pandas>=2.2",
  "openpyxl>=3.1",
  "polars>=1.0",
]

[dependency-groups]
dev = [
  "alembic>=1.13",
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
warn_unused_ignores = false
check_untyped_defs = true
